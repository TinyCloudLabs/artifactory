services:
  feed-host:
    # Phala stores Compose without shell interpolation, so production pins the
    # published linux/amd64 digest directly.
    image: ghcr.io/tinycloudlabs/feed-host@sha256:02a0c205ab982eb40926a466e34e267cd537182252aa5e5c07319346dc31b5a8
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      FEED_HOST_HOSTNAME: "0.0.0.0"
      FEED_HOST_PORT: "8787"
      FEED_HOST_STATE_DIR: "/home/bun/.tinycloud-feed-host"
      FEED_HOST_ALLOWED_ORIGINS: "https://feed.tinycloud.xyz,https://tinyfeed.pages.dev"
      FEED_HOST_SEED: "0"
      FEED_HOST_DEV_PUBLISH: "0"
      TINYCLOUD_HOST: "https://node.tinycloud.xyz"
    volumes:
      - feed-host-state:/home/bun/.tinycloud-feed-host

volumes:
  feed-host-state:

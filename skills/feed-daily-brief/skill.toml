schema = "feed.skill.v1"
id = "feed-daily-brief"
display_name = "Daily Brief"
version = "0.1.0"
source = "first_party"

[admission]
tier = 1
default_state = "enabled"
review_status = "reviewed"

[[produces]]
artifact_type = "daily_brief"
render_shape = "longform"
label = "Daily Brief"
output_schema = "schemas/output.schema.json"
outward = false

[requires]
source_kinds = ["listen_conversation"]
artifact_kinds = ["daily_brief"]
max_source_refs = 1
max_input_tokens = 12000
needs_media = false

[runtime]
runtime_class = "stub"
provider_class = "none"
credential_mode = "none"
egress_class = "none"
allowed_tools = []
disallowed_tools = ["tinycloud", "shell", "network"]

[workflow]
executor = "stub"
ref = "workflows/feed-daily-brief.stub.json"
digest = "sha256:b60023c21c35a3ff09d1860f1eee5b199e95261768a5886194960dbef8448487"

[limits]
max_accepted_artifacts = 1
timeout_ms = 1000
max_output_bytes = 4096
max_model_calls = 0

[settings]
schema = "schemas/settings.schema.json"

[validation]
validator_refs = ["schema", "source_refs", "critic_pass"]
evaluator_refs = ["evaluators/quality.md"]
require_quote_anchoring = false

[disclosure]
user_copy = "Creates a daily role-aware briefing from authorized context, with confidence, implications, and continuity."

name: Feed Host monitor

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: feed-host-monitor
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FEED_HOST_ORIGIN: https://api.feed.tinycloud.xyz
    steps:
      - name: Health
        run: |
          curl --fail --silent --show-error --max-time 15 "$FEED_HOST_ORIGIN/health" | jq -e '.ok == true and .serviceReady == true'

      - name: Diagnostics alerts
        env:
          TOKEN: ${{ secrets.FEED_HOST_DIAGNOSTICS_TOKEN }}
        run: |
          if [[ -z "$TOKEN" ]]; then
            echo "::warning::FEED_HOST_DIAGNOSTICS_TOKEN secret not set; skipping diagnostics probe."
            exit 0
          fi
          set +e
          status="$(curl --silent --show-error --output /tmp/diag.json --write-out '%{http_code}' --max-time 15 \
            -H "Authorization: Bearer $TOKEN" "$FEED_HOST_ORIGIN/admin/diagnostics")"
          curl_exit=$?
          set -e
          if [[ "$curl_exit" -ne 0 ]]; then
            echo "::error::Feed Host diagnostics request failed (curl exit $curl_exit, HTTP ${status:-000})."
            exit "$curl_exit"
          fi
          if [[ "$status" == "404" ]]; then
            echo "::warning::diagnostics endpoint not enabled on the deployed host yet (404); skipping."
            exit 0
          fi
          if [[ "$status" != "200" ]]; then
            echo "::error::Feed Host diagnostics returned HTTP $status."
            exit 1
          fi
          jq --exit-status '
            (.actors | type == "object")
              and ([.actors[]] | length > 0)
              and all(.actors[]; (.alerts | type == "object"))
          ' /tmp/diag.json >/dev/null || {
            echo "::error::Feed Host returned an incomplete alerts diagnostics payload."
            exit 1
          }
          firing="$(jq '[.actors[]?.alerts // {} | to_entries[] | select(.value == true) | .key] | unique' /tmp/diag.json)"
          echo "alerts firing: $firing"
          # Acknowledged alerts (known, tracked issues) downgrade to warnings so the
          # monitor only FAILS on new/unacknowledged alerts. Manage the list with:
          #   gh variable set FEED_MONITOR_ACKED_ALERTS --body "alertA,alertB"
          # Clear it the moment the tracked fix ships.
          acked="${{ vars.FEED_MONITOR_ACKED_ALERTS }}"
          acked_json="$(jq -Rc 'split(",") | map(gsub("\\s";"")) | map(select(length > 0))' <<<"$acked")"
          unacked="$(jq --argjson acked "$acked_json" '[.[] | select(. as $a | $acked | index($a) | not)]' <<<"$firing")"
          acked_firing="$(jq --argjson acked "$acked_json" '[.[] | select(. as $a | $acked | index($a))]' <<<"$firing")"
          if [[ "$(jq 'length' <<<"$acked_firing")" -gt 0 ]]; then
            echo "::warning::acknowledged alerts still firing (tracked, fix in flight): $acked_firing"
          fi
          test "$(jq 'length' <<<"$unacked")" -eq 0 || {
            echo "::error::feed-host diagnostics alerts firing (unacknowledged): $unacked"
            exit 1
          }

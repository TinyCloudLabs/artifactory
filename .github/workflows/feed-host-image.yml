name: Feed Host image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "harness/feed-host/Dockerfile"
      - "skills/_shared/lib/**"
      - "submodules/feed"
      - ".github/workflows/feed-host-image.yml"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Resolve source revisions
        id: revisions
        run: echo "feed=$(git -C submodules/feed rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/tinycloudlabs/feed-host
          tags: type=sha,format=long

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: harness/feed-host/Dockerfile
          platforms: linux/amd64
          build-args: |
            ARTIFACTORY_COMMIT=${{ github.sha }}
            FEED_COMMIT=${{ steps.revisions.outputs.feed }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Verify the Phala CVM can pull anonymously
        run: |
          docker logout ghcr.io
          docker pull '${{ steps.meta.outputs.tags }}'

      - name: Record immutable image digest
        run: echo '${{ steps.build.outputs.digest }}'

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FEED_HOST_ORIGIN: https://1de7413de0a2c483b00c75e7cb3ece691ce4375f-8787.dstack-pha-prod5.phala.network
      PHALA_API_TOKEN: ${{ secrets.PHALA_CLOUD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Phala CLI
        run: npm install --global phala@1.1.12

      - name: Verify deployment credentials
        run: |
          if [[ -z "$PHALA_API_TOKEN" ]]; then
            echo "::error::PHALA_CLOUD_API_KEY must be configured as an Actions secret."
            exit 1
          fi

      - name: Record Feed Host identity
        id: before
        run: |
          echo "delegate_did=$(curl --fail --silent --show-error "$FEED_HOST_ORIGIN/delegation-policy" | jq --raw-output --exit-status '.delegateDID')" >> "$GITHUB_OUTPUT"

      - name: Render immutable production compose file
        run: |
          cp harness/feed-host/docker-compose.yml /tmp/feed-host-compose.yml
          sed -i "s|^[[:space:]]*image: ghcr.io/tinycloudlabs/feed-host@sha256:.*$|    image: ghcr.io/tinycloudlabs/feed-host@${{ needs.publish.outputs.image_digest }}|" /tmp/feed-host-compose.yml
          grep -F "ghcr.io/tinycloudlabs/feed-host@${{ needs.publish.outputs.image_digest }}" /tmp/feed-host-compose.yml
          docker compose -f /tmp/feed-host-compose.yml config --quiet

      - name: Deploy Feed Host to Phala
        run: |
          phala deploy \
            --api-token "$PHALA_API_TOKEN" \
            --cvm-id feed-host \
            --compose /tmp/feed-host-compose.yml \
            --no-public-logs \
            --no-public-sysinfo

      - name: Verify Feed Host rollout
        run: |
          for _ in {1..90}; do
            if curl --fail --silent --show-error --max-time 15 "$FEED_HOST_ORIGIN/health"; then
              delegate_did="$(curl --fail --silent --show-error "$FEED_HOST_ORIGIN/delegation-policy" | jq --raw-output --exit-status '.delegateDID')"
              test "$delegate_did" = "${{ steps.before.outputs.delegate_did }}"
              curl --fail --silent --show-error --max-time 15 https://api.feed.tinycloud.xyz/health
              exit 0
            fi
            sleep 5
          done
          echo "Feed Host did not become healthy after deployment."
          exit 1

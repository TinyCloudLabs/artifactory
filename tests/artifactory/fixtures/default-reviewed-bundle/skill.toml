schema = "feed.skill.v1"
id = "default-reviewed-bundle"
display_name = "Default Reviewed Bundle"
version = "0.1.0"
source = "first_party"

[admission]
tier = 1
default_state = "enabled"
review_status = "reviewed"

[[produces]]
artifact_type = "stub_artifact"
render_shape = "short_form"
label = "Stub Artifact"
output_schema = "schemas/output.schema.json"
outward = false

[requires]
source_kinds = ["listen_conversation"]
artifact_kinds = []
max_source_refs = 1
max_input_tokens = 12000
needs_media = false

[runtime]
runtime_class = "stub"
provider_class = "none"
credential_mode = "none"
egress_class = "none"
allowed_tools = []
disallowed_tools = ["tinycloud", "shell", "network"]

[workflow]
executor = "stub"
ref = "workflows/default-reviewed-bundle.stub.json"
digest = "sha256:770a4971a4481732dd85e19ca83321113a8ae3754e9d61df06162999df35745d"

[limits]
max_accepted_artifacts = 1
timeout_ms = 1000
max_output_bytes = 4096
max_model_calls = 0

[settings]
schema = "schemas/settings.schema.json"

[validation]
validator_refs = []
evaluator_refs = ["evaluators/review.md"]
require_quote_anchoring = false

[disclosure]
user_copy = "Reads bounded Listen excerpts and emits a single reviewed stub artifact."
